<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cook mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C3FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C0E13; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 28px; overflow: hidden; font-feature-settings: 'tnum' 1, 'cv11' 1;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="DinnerWeek.dc.html" aria-label="Close cook mode" style="width: 44px; height: 44px; border-radius: 22px; background: #161922; border: 1px solid rgba(255,255,255,0.08); color: #F2F3F5; display: flex; align-items: center; justify-content: center;">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
    <span style="font-size: 15px; font-weight: 600;">Chicken fajitas</span>
    <span style="font-size: 13px; color: #9BA1AD; min-width: 44px; text-align: right;">3 of 6</span>
  </div>

  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px;">
    <span style="height: 4px; border-radius: 2px; background: #5B8CFF;"></span>
    <span style="height: 4px; border-radius: 2px; background: #5B8CFF;"></span>
    <span style="height: 4px; border-radius: 2px; background: #5B8CFF;"></span>
    <span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1);"></span>
    <span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1);"></span>
    <span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1);"></span>
  </div>

  <section aria-label="Step 3" style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
    <span style="font-size: 13px; font-weight: 600; color: #9BA1AD; text-transform: uppercase; letter-spacing: 0.08em;">Step 3</span>
    <p style="margin: 0; font-size: 28px; font-weight: 500; line-height: 1.25; letter-spacing: -0.01em;">Spread the chicken and peppers on the sheet pan and roast at 425°F.</p>
  </section>

  <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 18px; border-radius: 20px; border: 1px solid rgba(91,140,255,0.3); background: rgba(91,140,255,0.10); color: #F2F3F5; cursor: pointer; font-family: Inter, system-ui, sans-serif; text-align: left;">
    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7FA6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/></svg>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 1px;">
      <span style="font-size: 26px; font-weight: 300;">20:00</span>
      <span style="font-size: 13px; color: #9BA1AD;">Roast timer · also shows on the wall</span>
    </span>
    <span style="font-size: 15px; font-weight: 600; color: #7FA6FF;">Start</span>
  </button>

  <section aria-labelledby="need-h" style="border-radius: 20px; background: #161922; border: 1px solid rgba(255,255,255,0.06); padding: 6px 16px; display: flex; flex-direction: column;">
    <h2 id="need-h" style="margin: 10px 0 4px; font-size: 13px; font-weight: 600; color: #9BA1AD; text-transform: uppercase; letter-spacing: 0.06em;">For this step</h2>
    <sc-for list="{{items}}" as="i" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-top: {{i.border}};">
        <span style="width: 22px; height: 22px; border-radius: 11px; border: {{i.ring}}; background: {{i.fill}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #0C0E13;">
          <sc-if value="{{i.done}}" hint-placeholder-val="{{false}}">
            <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </sc-if>
        </span>
        <span style="flex: 1; font-size: 16px;">{{i.name}}</span>
        <span style="font-size: 14px; color: #9BA1AD;">{{i.qty}}</span>
      </div>
    </sc-for>
  </section>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: rgba(255,181,71,0.10); border: 1px solid rgba(255,181,71,0.22);">
    <span style="width: 32px; height: 32px; border-radius: 16px; background: rgba(255,181,71,0.18); color: #FFB547; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;">LE</span>
    <span style="flex: 1; font-size: 14px; line-height: 1.4;"><span style="font-weight: 600;">Kitchen helper:</span> Leo sets the table during this step · +3 pts</span>
  </div>

  <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
    <button type="button" style="min-height: 56px; border-radius: 16px; border: none; background: rgba(255,255,255,0.08); color: #F2F3F5; font: 600 17px Inter, system-ui, sans-serif; cursor: pointer;">Back</button>
    <button type="button" style="min-height: 56px; border-radius: 16px; border: none; background: #F2F3F5; color: #0C0E13; font: 600 17px Inter, system-ui, sans-serif; cursor: pointer;">Next step</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function it(name, qty, done, first) {
      return { name: name, qty: qty, done: done, border: first ? 'none' : '1px solid rgba(255,255,255,0.06)', ring: done ? 'none' : '2px solid #5C6270', fill: done ? '#30D158' : 'transparent' };
    }
    return { items: [ it('Chicken thighs, sliced', '2 lb', true, true), it('Bell peppers', '3', true, false), it('Fajita seasoning', '2 tbsp', false, false) ] };
  }
}
</script>
</body>
</html>
