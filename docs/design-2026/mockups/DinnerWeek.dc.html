<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>This week's dinners</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C3FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C0E13; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 60px 20px 28px; overflow: hidden; font-feature-settings: 'tnum' 1, 'cv11' 1;">

  <header style="display: flex; justify-content: space-between; align-items: flex-end;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 13px; font-weight: 500; color: #9BA1AD;">Week of Nov 9</span>
      <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em;">Dinners</h1>
    </div>
    <button type="button" aria-label="Plan options: presets, print, clear week" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.08); background: #161922; color: #F2F3F5; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>

  <div role="tablist" aria-label="Days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button type="button" role="tab" aria-selected="{{d.selected}}" style="min-height: 58px; border-radius: 14px; border: none; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-family: Inter, system-ui, sans-serif;">
        <span style="font-size: 11px; font-weight: 500; opacity: 0.8;">{{d.dow}}</span>
        <span style="font-size: 17px; font-weight: 600;">{{d.num}}</span>
        <span style="width: 5px; height: 5px; border-radius: 3px; background: {{d.dot}};"></span>
      </button>
    </sc-for>
  </div>

  <section aria-label="Tonight" style="border-radius: 22px; background: #161922; border: 1px solid rgba(255,255,255,0.06); overflow: hidden;">
    <div style="height: 104px; background: linear-gradient(135deg, #3A2A1C 0%, #4A2F1E 50%, #2B2230 100%); display: flex; align-items: flex-end; padding: 12px 16px; box-sizing: border-box;">
      <span style="font-size: 12px; font-weight: 600; color: #FFD7B0; text-transform: uppercase; letter-spacing: 0.08em;">Tonight · Friday</span>
    </div>
    <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em;">Sheet-pan chicken fajitas</span>
        <span style="font-size: 13px; color: #9BA1AD;">35 min · serves 5 · rice, salsa · fruit for dessert</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <a href="CookMode.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 12px; background: #5B8CFF; color: #0C0E13; text-decoration: none; font-size: 15px; font-weight: 600;">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><path d="M6 17h12"/></svg>
          Start cooking
        </a>
        <a href="GroceryList.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; background: rgba(255,159,10,0.14); color: #FFB547; text-decoration: none; font-size: 15px; font-weight: 600;">2 items missing</a>
      </div>
    </div>
  </section>

  <section aria-labelledby="vote-h" style="border-radius: 22px; background: #161922; border: 1px solid rgba(255,255,255,0.06); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2 id="vote-h" style="margin: 0; font-size: 15px; font-weight: 600;">Saturday · family vote</h2>
      <span style="font-size: 12px; color: #9BA1AD;">closes 4 PM</span>
    </div>
    <sc-for list="{{votes}}" as="v" hint-placeholder-count="3">
      <button type="button" style="position: relative; min-height: 44px; border-radius: 12px; border: 1px solid {{v.border}}; background: rgba(255,255,255,0.03); color: #F2F3F5; display: flex; align-items: center; gap: 10px; padding: 0 12px; overflow: hidden; cursor: pointer; font-family: Inter, system-ui, sans-serif; text-align: left;">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{v.pct}}; background: rgba(91,140,255,0.12);"></span>
        <span style="position: relative; flex: 1; font-size: 15px; font-weight: {{v.weight}};">{{v.name}}</span>
        <span style="position: relative; font-size: 12px; color: #9BA1AD;">{{v.who}}</span>
      </button>
    </sc-for>
  </section>

  <section aria-label="Sunday" style="border-radius: 18px; border: 1px dashed rgba(255,255,255,0.16); padding: 12px 16px; display: flex; align-items: center; gap: 12px;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 15px; font-weight: 600;">Sunday · not planned</span>
      <span style="font-size: 13px; color: #9BA1AD;">Sam suggested “breakfast for dinner”</span>
    </div>
    <button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: rgba(255,255,255,0.08); color: #F2F3F5; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer;">Use it</button>
  </section>

  <a href="GroceryList.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 16px; background: rgba(48,209,88,0.10); border: 1px solid rgba(48,209,88,0.22); color: #F2F3F5; text-decoration: none;">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
    <span style="flex: 1; font-size: 15px;">Groceries synced from 5 dinners · <span style="font-weight: 600;">14 items</span></span>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var d = [['M', 9, 'done'], ['T', 10, 'done'], ['W', 11, 'done'], ['T', 12, 'done'], ['F', 13, 'today'], ['S', 14, 'vote'], ['S', 15, 'empty']];
    var dot = { done: '#5C6270', today: '#0C0E13', vote: '#5B8CFF', empty: 'transparent' };
    return {
      days: d.map(function (x) {
        var t = x[2] === 'today';
        return { dow: x[0], num: x[1], selected: t ? 'true' : 'false', bg: t ? '#F2F3F5' : '#161922', fg: t ? '#0C0E13' : '#F2F3F5', dot: dot[x[2]] };
      }),
      votes: [
        { name: 'Homemade pizza', who: 'Leo, Maya, Sam', pct: '75%', border: 'rgba(91,140,255,0.5)', weight: 600 },
        { name: 'Teriyaki bowls', who: 'Mom', pct: '25%', border: 'rgba(255,255,255,0.08)', weight: 500 },
        { name: 'Chili & cornbread', who: 'No votes', pct: '0%', border: 'rgba(255,255,255,0.08)', weight: 500 }
      ]
    };
  }
}
</script>
</body>
</html>
