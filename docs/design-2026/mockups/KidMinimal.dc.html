<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sam's day, minimal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5BE0}a:hover{color:#163F9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F7; color: #111318; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px; padding: 56px 20px 28px; overflow: hidden; font-feature-settings: 'tnum' 1, 'cv11' 1;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 2px; min-height: 44px; color: #1F5BE0; text-decoration: none; font-size: 17px; margin-left: -6px;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Family
    </a>
    <span style="font-size: 13px; color: #5E6370;">Fri, Nov 13</span>
  </div>

  <section aria-label="Sam's summary" style="display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em;">Sam</h1>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #E3E4E8; border-radius: 16px; overflow: hidden; border: 1px solid #E3E4E8;">
      <div style="background: #FFFFFF; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 22px; font-weight: 500;">2/11</span>
        <span style="font-size: 12px; color: #5E6370;">Done</span>
      </div>
      <div style="background: #FFFFFF; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 22px; font-weight: 500;">28</span>
        <span style="font-size: 12px; color: #5E6370;">Points</span>
      </div>
      <div style="background: #FFFFFF; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 22px; font-weight: 500;">2d</span>
        <span style="font-size: 12px; color: #5E6370;">Streak</span>
      </div>
    </div>
    <div style="height: 4px; border-radius: 2px; background: #E3E4E8; overflow: hidden;">
      <div style="width: 18%; height: 100%; background: #111318; border-radius: 2px;"></div>
    </div>
  </section>

  <div style="display: flex; flex-direction: column; gap: 20px;">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 6px;">
        <h2 style="margin: 0 4px; font-size: 13px; font-weight: 500; color: #5E6370;">{{s.label}}</h2>
        <div style="background: #FFFFFF; border: 1px solid #E3E4E8; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;">
          <sc-for list="{{s.tasks}}" as="t" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; box-sizing: border-box; border-top: {{t.border}};">
              <button type="button" aria-label="{{t.checkLabel}}" style="width: 24px; height: 24px; border-radius: 12px; flex-shrink: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; border: {{t.ringBorder}}; background: {{t.ringFill}}; color: #FFFFFF;">
                <sc-if value="{{t.done}}" hint-placeholder-val="{{false}}">
                  <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </sc-if>
              </button>
              <span style="flex: 1; font-size: 16px; color: {{t.color}}; text-decoration: {{t.strike}};">{{t.title}}</span>
              <span style="font-size: 13px; color: {{t.metaColor}}; white-space: nowrap;">{{t.meta}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <p style="margin: auto 4px 0; font-size: 13px; color: #5E6370; line-height: 1.5;">Minimal style: no emoji, no colour except for deadlines, plain words. Set per kid in Family settings.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function task(title, meta, done, urgent, first) {
      return {
        title: title, meta: meta, done: !!done,
        border: first ? 'none' : '1px solid #EDEEF1',
        strike: done ? 'line-through' : 'none',
        color: done ? '#8A8F9C' : '#111318',
        metaColor: urgent ? '#B45309' : '#5E6370',
        ringBorder: done ? 'none' : '1.5px solid #9AA0AC',
        ringFill: done ? '#111318' : 'transparent',
        checkLabel: done ? title + ', done' : 'Mark ' + title + ' done'
      };
    }
    return {
      sections: [
        { label: 'Afternoon', tasks: [
          task('Empty the dishwasher', 'Due 5:30', false, true, true),
          task('Vacuum the stairs', '+5', false, false, false),
          task('Practice piano', 'Skip requested', false, false, false),
          task('Water the plants', '+2', true, false, false)
        ] },
        { label: 'Evening', tasks: [
          task('Homework check-in', '+4', false, false, true),
          task('Lay out clothes for tomorrow', '+1', false, false, false),
          task('Brush teeth', 'Routine', true, false, false)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
