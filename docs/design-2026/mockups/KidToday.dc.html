<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leo's day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C3FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C0E13; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 28px; overflow: hidden; font-feature-settings: 'tnum' 1, 'cv11' 1;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 2px; min-height: 44px; color: #7FA6FF; text-decoration: none; font-size: 17px; margin-left: -6px;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Family
    </a>
    <a href="Savings.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 18px; background: #161922; border: 1px solid rgba(255,255,255,0.06); color: #F2F3F5; text-decoration: none; font-size: 15px; font-weight: 500;">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFB547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      45 pts
    </a>
  </div>

  <section aria-label="Leo's progress today" style="display: flex; align-items: center; gap: 20px;">
    <div style="position: relative; width: 112px; height: 112px; flex-shrink: 0;">
      <svg role="img" aria-label="4 of 13 tasks done" width="112" height="112" viewBox="0 0 112 112" style="position: absolute; inset: 0; transform: rotate(-90deg);">
        <circle cx="56" cy="56" r="48" fill="none" stroke="rgba(255,181,71,0.14)" stroke-width="10"></circle>
        <circle cx="56" cy="56" r="48" fill="none" stroke="#FFB547" stroke-width="10" stroke-linecap="round" stroke-dasharray="92.8 301.6"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span style="font-size: 30px; font-weight: 300; letter-spacing: -0.02em;">4<span style="color: #7C8290;">/13</span></span>
        <span style="font-size: 11px; color: #9BA1AD;">done</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; flex: 1;">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em;">Leo</h1>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 20px; font-weight: 500;">4 days</span>
          <span style="font-size: 12px; color: #9BA1AD;">Streak</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 20px; font-weight: 500;">$85.50</span>
          <span style="font-size: 12px; color: #9BA1AD;">Saved</span>
        </div>
      </div>
    </div>
  </section>

  <div style="display: flex; flex-direction: column; gap: 18px;">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px;">
          <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #9BA1AD; text-transform: uppercase; letter-spacing: 0.06em;">{{s.label}}</h2>
          <span style="font-size: 13px; color: {{s.metaColor}};">{{s.meta}}</span>
        </div>
        <div style="background: #161922; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column;">
          <sc-for list="{{s.tasks}}" as="t" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 60px; box-sizing: border-box; border-top: {{t.border}}; opacity: {{t.opacity}};">
              <button type="button" aria-label="{{t.checkLabel}}" style="width: 28px; height: 28px; border-radius: 14px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; border: {{t.ringBorder}}; background: {{t.ringFill}}; color: #0C0E13;">
                <sc-if value="{{t.done}}" hint-placeholder-val="{{false}}">
                  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </sc-if>
              </button>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 16px; font-weight: 500; text-decoration: {{t.strike}};">{{t.title}}</span>
                <span style="font-size: 13px; color: #9BA1AD;">{{t.meta}}</span>
              </div>
              <sc-if value="{{t.due}}" hint-placeholder-val="{{false}}">
                <span style="display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 12px; background: rgba(255,159,10,0.14); color: #FFB547; font-size: 12px; font-weight: 600; white-space: nowrap;">
                  <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                  {{t.due}}
                </span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <a href="Savings.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: rgba(91,140,255,0.10); border: 1px solid rgba(91,140,255,0.22); text-decoration: none; color: #F2F3F5;">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7FA6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
    <span style="flex: 1; font-size: 15px;"><span style="font-weight: 600;">5 points</span> to 30 min screen time</span>
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7FA6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function task(title, meta, done, due, first) {
      return {
        title: title, meta: meta, done: !!done, due: due || false,
        border: first ? 'none' : '1px solid rgba(255,255,255,0.06)',
        opacity: done ? 0.55 : 1,
        strike: done ? 'line-through' : 'none',
        ringBorder: done ? 'none' : '2px solid #5C6270',
        ringFill: done ? '#30D158' : 'transparent',
        checkLabel: done ? title + ', done' : 'Mark ' + title + ' done'
      };
    }
    return {
      sections: [
        { label: 'Morning', meta: '3 of 3', metaColor: '#30D158', tasks: [
          task('Make your bed', '+3 pts · 3 steps', true, false, true)
        ] },
        { label: 'Afternoon', meta: '1 of 4', metaColor: '#9BA1AD', tasks: [
          task('Take out the small trash', '+6 pts · 5 min timer', false, '59m', true),
          task('Pick up floor toys & books', '+4 pts · until 7:00 PM', false, false, false),
          task('Feed the dog', '+2 pts', true, false, false)
        ] },
        { label: 'Evening', meta: '0 of 3', metaColor: '#9BA1AD', tasks: [
          task('Read for 20 minutes', '+5 pts · log your book', false, false, true),
          task('Pack school bag', '+2 pts', false, false, false)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
