<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wall: Leo's session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C3FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #08090C; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 32px; padding: 44px 48px; font-feature-settings: 'tnum' 1, 'cv11' 1;">

  <aside style="display: flex; flex-direction: column; gap: 24px;">
    <a href="Kiosk.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 20px 0 14px; border-radius: 26px; background: #12141A; border: 1px solid rgba(255,255,255,0.08); color: #F2F3F5; text-decoration: none; font-size: 18px; font-weight: 500;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Done — back to the wall
    </a>

    <div style="display: flex; align-items: center; gap: 22px; margin-top: 12px;">
      <div style="position: relative; width: 150px; height: 150px; flex-shrink: 0;">
        <svg role="img" aria-label="5 of 13 done" width="150" height="150" viewBox="0 0 150 150" style="position: absolute; inset: 0; transform: rotate(-90deg);">
          <circle cx="75" cy="75" r="66" fill="none" stroke="rgba(255,181,71,0.14)" stroke-width="12"></circle>
          <circle cx="75" cy="75" r="66" fill="none" stroke="#FFB547" stroke-width="12" stroke-linecap="round" stroke-dasharray="159.5 414.7"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 40px; font-weight: 300;">5<span style="color: #6E7482;">/13</span></span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em;">Leo</h1>
        <span style="font-size: 18px; color: #9BA1AD;">51 pts · 4-day streak</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 18px; background: rgba(48,209,88,0.10); border: 1px solid rgba(48,209,88,0.22);">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #30D158; color: #08090C; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>
      <span style="font-size: 17px;"><span style="font-weight: 600;">Trash taken out</span> · +6 pts</span>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 18px; background: #12141A; border: 1px solid rgba(255,255,255,0.06);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #9BA1AD;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          Kid session · settings hidden
        </span>
        <span style="font-size: 15px; font-weight: 600;">0:45</span>
      </div>
      <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden;">
        <div style="width: 75%; height: 100%; background: #7C8290; border-radius: 2px;"></div>
      </div>
      <span style="font-size: 13px; color: #7C8290;">Returns to the wall when idle</span>
    </div>
  </aside>

  <main style="display: flex; flex-direction: column; gap: 22px;">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 10px;">
        <h2 style="margin: 0 6px; font-size: 15px; font-weight: 600; color: #9BA1AD; text-transform: uppercase; letter-spacing: 0.08em;">{{s.label}}</h2>
        <div style="background: #12141A; border: 1px solid rgba(255,255,255,0.06); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column;">
          <sc-for list="{{s.tasks}}" as="t" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 18px; padding: 0 22px; min-height: 80px; border-top: {{t.border}}; opacity: {{t.opacity}};">
              <button type="button" aria-label="{{t.checkLabel}}" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; border: {{t.ringBorder}}; background: {{t.ringFill}}; color: #08090C;">
                <sc-if value="{{t.done}}" hint-placeholder-val="{{false}}">
                  <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </sc-if>
              </button>
              <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
                <span style="font-size: 22px; font-weight: 500; text-decoration: {{t.strike}};">{{t.title}}</span>
                <span style="font-size: 15px; color: #9BA1AD;">{{t.meta}}</span>
              </div>
              <sc-if value="{{t.timer}}" hint-placeholder-val="{{false}}">
                <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 24px; border: none; background: rgba(91,140,255,0.14); color: #7FA6FF; font: 600 16px Inter, system-ui, sans-serif; cursor: pointer;">
                  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/></svg>
                  {{t.timer}}
                </button>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    function t(title, meta, done, timer, first) {
      return {
        title: title, meta: meta, done: !!done, timer: timer || false,
        border: first ? 'none' : '1px solid rgba(255,255,255,0.06)',
        opacity: done ? 0.5 : 1, strike: done ? 'line-through' : 'none',
        ringBorder: done ? 'none' : '2.5px solid #4A505D',
        ringFill: done ? '#30D158' : 'transparent',
        checkLabel: done ? title + ', done' : 'Mark ' + title + ' done'
      };
    }
    return {
      sections: [
        { label: 'Afternoon', tasks: [
          t('Take out the small trash', '+6 pts', true, false, true),
          t('Pick up floor toys & books', '+4 pts · until 7:00 PM', false, 'Start 10 min', false),
          t('Feed the dog', '+2 pts', true, false, false)
        ] },
        { label: 'Evening', tasks: [
          t('Read for 20 minutes', '+5 pts · log your book', false, 'Start 20 min', true),
          t('Pack school bag', '+2 pts', false, false, false)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
