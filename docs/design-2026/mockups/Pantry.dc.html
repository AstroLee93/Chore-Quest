<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry and budget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C3FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C0E13; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 56px 20px 28px; overflow: hidden; font-feature-settings: 'tnum' 1, 'cv11' 1;">

  <a href="GroceryList.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 2px; min-height: 44px; color: #7FA6FF; text-decoration: none; font-size: 17px; margin-left: -6px;">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Groceries
  </a>

  <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em;">Pantry</h1>

  <div role="tablist" aria-label="Pantry view" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 10px; background: rgba(118,118,128,0.24);">
    <button type="button" role="tab" aria-selected="true" style="min-height: 34px; border-radius: 8px; border: none; background: #636366; color: #FFFFFF; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer;">Staples</button>
    <button type="button" role="tab" aria-selected="false" style="min-height: 34px; border-radius: 8px; border: none; background: transparent; color: #F2F3F5; font: 500 14px Inter, system-ui, sans-serif; cursor: pointer;">Spices</button>
    <button type="button" role="tab" aria-selected="false" style="min-height: 34px; border-radius: 8px; border: none; background: transparent; color: #F2F3F5; font: 500 14px Inter, system-ui, sans-serif; cursor: pointer;">Budget</button>
  </div>

  <section aria-labelledby="stock-h" style="border-radius: 20px; background: #161922; border: 1px solid rgba(255,255,255,0.06); padding: 4px 16px; display: flex; flex-direction: column;">
    <h2 id="stock-h" style="margin: 12px 0 4px; font-size: 13px; font-weight: 600; color: #9BA1AD; text-transform: uppercase; letter-spacing: 0.06em;">Tap a level to update</h2>
    <sc-for list="{{stock}}" as="s" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: {{s.border}};">
        <span style="flex: 1; font-size: 16px;">{{s.name}}</span>
        <div role="img" aria-label="{{s.label}}" style="display: grid; grid-template-columns: repeat(3, 18px); gap: 3px;">
          <span style="height: 8px; border-radius: 2px; background: {{s.b1}};"></span>
          <span style="height: 8px; border-radius: 2px; background: {{s.b2}};"></span>
          <span style="height: 8px; border-radius: 2px; background: {{s.b3}};"></span>
        </div>
        <span style="width: 44px; font-size: 13px; color: {{s.color}}; text-align: right;">{{s.state}}</span>
      </div>
    </sc-for>
  </section>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: rgba(255,159,10,0.10); border: 1px solid rgba(255,159,10,0.22);">
    <span style="flex: 1; font-size: 14px;"><span style="font-weight: 600;">3 low or out</span> · milk, rice, dish soap</span>
    <button type="button" style="min-height: 34px; padding: 0 12px; border-radius: 17px; border: none; background: #FFB547; color: #0C0E13; font: 600 13px Inter, system-ui, sans-serif; cursor: pointer; white-space: nowrap;">Add to list</button>
  </div>

  <section aria-labelledby="budget-h" style="border-radius: 20px; background: #161922; border: 1px solid rgba(255,255,255,0.06); padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2 id="budget-h" style="margin: 0; font-size: 15px; font-weight: 600;">Grocery spending</h2>
      <span style="font-size: 13px; color: #9BA1AD;">target $120 / wk</span>
    </div>
    <div role="img" aria-label="Last four weeks: 112, 131, 104 and 86 dollars so far" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: end; height: 92px; position: relative;">
      <span style="position: absolute; left: 0; right: 0; bottom: 68px; border-top: 1px dashed rgba(255,255,255,0.22);"></span>
      <sc-for list="{{weeks}}" as="w" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end;">
          <span style="font-size: 12px; color: #C9CDD5;">{{w.amt}}</span>
          <div style="width: 100%; height: {{w.h}}; border-radius: 6px; background: {{w.fill}};"></div>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 13px; color: #9BA1AD;">Prices learned from 6 scanned receipts</span>
  </section>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #161922; border: 1px solid rgba(255,255,255,0.06);">
    <span style="width: 32px; height: 32px; border-radius: 16px; background: rgba(91,140,255,0.14); color: #7FA6FF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;">SA</span>
    <span style="flex: 1; font-size: 14px; line-height: 1.4;"><span style="font-weight: 600;">Pantry check</span> is Sam's Sunday chore · +3 pts</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var off = 'rgba(255,255,255,0.1)';
    function s(name, lvl, first) {
      var c = lvl === 3 ? '#30D158' : lvl === 2 ? '#9BA1AD' : lvl === 1 ? '#FFB547' : '#FF6B5E';
      var st = ['Out', 'Low', 'Half', 'Full'][lvl];
      return { name: name, state: st, label: name + ': ' + st, color: lvl === 2 ? '#9BA1AD' : c,
        b1: lvl >= 1 ? c : off, b2: lvl >= 2 ? c : off, b3: lvl >= 3 ? c : off,
        border: first ? 'none' : '1px solid rgba(255,255,255,0.06)' };
    }
    var w = [112, 131, 104, 86];
    return {
      stock: [s('Eggs', 3, true), s('Milk', 1, false), s('Rice', 0, false), s('Pasta', 2, false), s('Dish soap', 1, false)],
      weeks: w.map(function (v, i) {
        return { amt: '$' + v, h: Math.round(v / 140 * 76) + 'px', fill: i === 3 ? '#5B8CFF' : (v > 120 ? 'rgba(255,159,10,0.55)' : 'rgba(91,140,255,0.32)') };
      })
    };
  }
}
</script>
</body>
</html>
