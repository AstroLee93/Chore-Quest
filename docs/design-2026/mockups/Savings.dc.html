<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leo's savings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C3FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C0E13; color: #F2F3F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px; padding: 56px 20px 28px; overflow: hidden; font-feature-settings: 'tnum' 1, 'cv11' 1;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="KidToday.dc.html" style="display: flex; align-items: center; gap: 2px; min-height: 44px; color: #7FA6FF; text-decoration: none; font-size: 17px; margin-left: -6px;">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Leo
    </a>
    <button type="button" aria-label="Add a deposit" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.08); background: #161922; color: #F2F3F5; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <section aria-label="Total saved" style="display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 13px; font-weight: 600; color: #9BA1AD; text-transform: uppercase; letter-spacing: 0.06em;">Savings</span>
    <span style="font-size: 48px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05;">$85<span style="color: #7C8290;">.50</span></span>
    <span style="font-size: 14px; color: #30D158;">+$12.40 this week</span>
  </section>

  <section aria-label="Goal: Nintendo Switch OLED" style="background: #161922; border: 1px solid rgba(255,255,255,0.06); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <div style="position: relative; width: 260px; height: 140px;">
      <svg role="img" aria-label="24 percent of goal saved" width="260" height="140" viewBox="0 0 260 140" style="position: absolute; inset: 0;">
        <path d="M 20 130 A 110 110 0 0 1 240 130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="14" stroke-linecap="round"></path>
        <path d="M 20 130 A 110 110 0 0 1 240 130" fill="none" stroke="#5B8CFF" stroke-width="14" stroke-linecap="round" stroke-dasharray="82.9 345.6"></path>
      </svg>
      <div style="position: absolute; left: 0; right: 0; bottom: 4px; display: flex; flex-direction: column; align-items: center;">
        <span style="font-size: 36px; font-weight: 300; letter-spacing: -0.02em;">24%</span>
        <span style="font-size: 12px; color: #9BA1AD;">of $349.99</span>
      </div>
    </div>
    <span style="font-size: 17px; font-weight: 600; margin-top: 8px;">Nintendo Switch OLED</span>
    <span style="font-size: 14px; color: #9BA1AD; text-align: center;">$264.49 to go · about 22 weeks at your pace</span>
  </section>

  <section aria-labelledby="weeks-h" style="background: #161922; border: 1px solid rgba(255,255,255,0.06); border-radius: 22px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h2 id="weeks-h" style="margin: 0; font-size: 15px; font-weight: 600;">Last 8 weeks</h2>
      <span style="font-size: 13px; color: #9BA1AD;">avg $11.80 / wk</span>
    </div>
    <div role="img" aria-label="Weekly deposits, rising from 7 to 14 dollars" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; align-items: end; height: 96px;">
      <sc-for list="{{weeks}}" as="w" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end;">
          <div style="width: 100%; height: {{w.h}}; border-radius: 6px; background: {{w.fill}};"></div>
          <span style="font-size: 11px; color: #7C8290;">{{w.label}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section aria-labelledby="recent-h" style="display: flex; flex-direction: column; gap: 8px;">
    <h2 id="recent-h" style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #9BA1AD; text-transform: uppercase; letter-spacing: 0.06em;">Recent</h2>
    <div style="background: #161922; border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; overflow: hidden;">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: {{r.border}};">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px;">
            <span style="font-size: 15px;">{{r.title}}</span>
            <span style="font-size: 12px; color: #9BA1AD;">{{r.when}}</span>
          </div>
          <span style="font-size: 15px; font-weight: 500; color: #30D158;">{{r.amount}}</span>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var vals = [7, 9, 8, 11, 12, 13, 15, 12.4];
    var max = 15;
    var labels = ['S', 'O', '', 'O', '', 'N', '', 'Now'];
    return {
      weeks: vals.map(function (v, i) {
        return {
          h: Math.round((v / max) * 72) + 'px',
          fill: i === vals.length - 1 ? '#5B8CFF' : 'rgba(91,140,255,0.32)',
          label: labels[i] || '·'
        };
      }),
      recent: [
        { title: 'Chores this week', when: 'Today', amount: '+$4.20', border: 'none' },
        { title: 'Interest', when: 'Nov 10', amount: '+$0.71', border: '1px solid rgba(255,255,255,0.06)' },
        { title: 'Birthday gift from Grandma', when: 'Nov 7', amount: '+$7.49', border: '1px solid rgba(255,255,255,0.06)' }
      ]
    };
  }
}
</script>
</body>
</html>
